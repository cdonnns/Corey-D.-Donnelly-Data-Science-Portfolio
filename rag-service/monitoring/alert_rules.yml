groups:
  - name: rag-service-slos
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(rag_requests_total{status="error"}[5m]))
          / sum(rate(rag_requests_total[5m])) > 0.02
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Error rate above 2% for 5 minutes"

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99, rate(rag_request_latency_seconds_bucket[5m])) > 3
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "p99 latency above 3s for 10 minutes"

      - alert: RetrievalLatencyDegraded
        expr: |
          histogram_quantile(0.95, rate(rag_retrieval_latency_seconds_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Vector DB retrieval p95 above 500ms -- check index health"

      - alert: TokenSpendSpike
        expr: |
          sum(rate(rag_tokens_total[1h])) > 3 * sum(rate(rag_tokens_total[1h] offset 1d))
        labels:
          severity: warn
        annotations:
          summary: "Token usage 3x higher than same hour yesterday -- possible cost anomaly"
