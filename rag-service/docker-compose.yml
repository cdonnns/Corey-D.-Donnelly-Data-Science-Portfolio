services:
  rag-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RAG_ENVIRONMENT=dev
      - RAG_VECTOR_DB_URL=http://qdrant:6333
      - RAG_MLFLOW_TRACKING_URI=http://mlflow:5001
      # compose doesn't read .env into the container automatically, has to
      # be listed here explicitly or the app tries to hit real OpenAI
      - RAG_MOCK_LLM=true
    depends_on:
      - qdrant
      - mlflow
    networks: [rag-net]

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [rag-net]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    # 5000 is taken by macOS AirPlay Receiver, remapped host side to 5001
    ports:
      - "5001:5000"
    networks: [rag-net]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [rag-net]

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [rag-net]

volumes:
  qdrant-data:
  grafana-data:

networks:
  rag-net:
